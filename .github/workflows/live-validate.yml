name: Live validation (real cameras)

# Runs ONLY on a published release and on manual dispatch.  Both are
# maintainer-only events, which is what keeps this job - and the self-hosted
# runner and credentials it uses - unreachable from fork pull requests.
# Never add push/pull_request triggers here.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref to validate (defaults to the triggering ref)"
        required: false
        type: string
      models:
        description: "Limit to these model keys, comma-separated (e.g. A001513,A001064)"
        required: false
        type: string
      hold:
        description: "Seconds to hold each stream"
        required: false
        default: "16"
        type: string

permissions:
  contents: read

# Queue, never cancel.  Cancelling mid-handshake leaves the camera's viewer
# slot pinned for ~120 s, which would fail the next run for no reason - and
# only one run can use the cameras at a time regardless.
concurrency:
  group: aidot-live-hardware
  cancel-in-progress: false

jobs:
  live:
    name: Stream every camera on the LAN
    # The runner lives on the camera LAN.  Label it `aidot-lan` when you
    # register it; see docs/CI-RUNNER.md for the full setup and the security
    # posture this depends on.
    runs-on: [self-hosted, aidot-lan]
    # Environment-scoped credentials: the secrets exist only for jobs that
    # declare this environment, and it can carry a required-reviewer rule.
    environment: live-lan
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5 (node24)
        with:
          ref: ${{ inputs.ref || github.sha }}

      # A self-hosted runner keeps its filesystem between jobs, so build the
      # venv fresh each run: a stale dependency tree would validate code that
      # is not what this release ships.
      - name: Create a clean venv
        run: |
          rm -rf .venv-live
          python3 -m venv .venv-live
          .venv-live/bin/pip install --upgrade pip
          .venv-live/bin/pip install -e ".[webrtc]"

      - name: Report what we are validating
        run: |
          echo "ref:    ${{ inputs.ref || github.sha }}"
          echo "sha:    ${{ github.sha }}"
          .venv-live/bin/python -c "import aidot_cameras, sys; print('library:', aidot_cameras.__file__); print('python: ', sys.version)"
          ffmpeg -version | head -1

      - name: List cameras
        env:
          AIDOT_USERNAME: ${{ secrets.AIDOT_USERNAME }}
          AIDOT_PASSWORD: ${{ secrets.AIDOT_PASSWORD }}
          AIDOT_COUNTRY: ${{ vars.AIDOT_COUNTRY || 'US' }}
          # The CI account is a secondary one with the cameras shared to it, so
          # they all sit in a house it does not own.  Without this the harness
          # sees zero cameras.  Set the repo variable to '0' if CI ever moves
          # back to the owning account.
          AIDOT_INCLUDE_SHARED_HOUSES: ${{ vars.AIDOT_INCLUDE_SHARED_HOUSES || '1' }}
        run: .venv-live/bin/python scripts/live_validate.py --list --json-out ''

      - name: Validate every camera
        env:
          AIDOT_USERNAME: ${{ secrets.AIDOT_USERNAME }}
          AIDOT_PASSWORD: ${{ secrets.AIDOT_PASSWORD }}
          AIDOT_COUNTRY: ${{ vars.AIDOT_COUNTRY || 'US' }}
          AIDOT_INCLUDE_SHARED_HOUSES: ${{ vars.AIDOT_INCLUDE_SHARED_HOUSES || '1' }}
          AIDOT_VALIDATION_REF: ${{ github.sha }}
        run: |
          MODEL_ARGS=""
          if [ -n "${{ inputs.models }}" ]; then
            for m in $(echo "${{ inputs.models }}" | tr ',' ' '); do
              MODEL_ARGS="$MODEL_ARGS --model $m"
            done
          fi
          .venv-live/bin/python scripts/live_validate.py \
            --hold "${{ inputs.hold || '16' }}" \
            --json-out live-report.json \
            $MODEL_ARGS

      # always(): a FAILED run's report is the most useful artifact there is.
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: live-report-${{ github.sha }}
          path: live-report.json
          if-no-files-found: warn

      - name: Summary
        if: always()
        run: |
          if [ -f live-report.json ]; then
            {
              echo "### Live validation"
              echo ""
              .venv-live/bin/python - <<'PY'
          import json
          r = json.load(open("live-report.json"))
          print(f"**Overall: {r.get('verdict', '?')}**\n")
          print("| Camera | Model | Transport | Attempts | Verdict |")
          print("|---|---|---|---|---|")
          for c in r.get("cameras", []):
              tier = "" if c.get("tier") == "required" else " _(advisory)_"
              print(f"| {c.get('name')}{tier} | {c.get('model')} | "
                    f"{c.get('transport')} | {c.get('attempts_used')} | "
                    f"{c.get('verdict')} |")
          if r.get("missing_required_models"):
              print(f"\n**Missing required models:** {', '.join(r['missing_required_models'])}")
          PY
            } >> "$GITHUB_STEP_SUMMARY"
          fi
