name: Publish to PyPI

# Publishing is triggered ONLY by a published GitHub Release. (workflow_dispatch
# was removed deliberately: this job holds id-token: write for PyPI Trusted
# Publishing, so the trigger surface is kept as small as possible.)
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # Gate the release on a green test run so a broken build can never publish to
  # PyPI (the publish job holds id-token: write). Mirrors ci.yml's Alpine/musl
  # test job - the same libc the target runtime uses.
  test:
    name: Unit tests (Alpine / musl)
    runs-on: ubuntu-latest
    container: python:3.13-alpine
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5 (node24)
      - name: System deps
        run: apk add --no-cache git gcc musl-dev libffi-dev
      - name: Install package + test deps
        run: pip install -e ".[webrtc]" pytest pytest-asyncio
      - name: Run tests
        run: pytest tests/ -q

  # Releases must be validated against REAL cameras before they reach PyPI.
  # This job does not run the cameras itself - live-validate.yml does, on the
  # self-hosted runner, triggered by the same `release: published` event - it
  # WAITS for that run and requires it to have succeeded for THIS EXACT commit.
  #
  # Fails closed by construction: no run, a failed run, a cancelled run, or a
  # run that never finishes within the wait all block the publish. A runner
  # that is simply switched off blocks it too - that is deliberate, an
  # unvalidated release is exactly what this exists to prevent.
  live-gate:
    name: Require green live validation
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Emergency override check
        id: override
        env:
          OVERRIDE_SHA: ${{ vars.LIVE_GATE_OVERRIDE_SHA }}
        run: |
          # The override is a repo VARIABLE that must equal this exact commit.
          # Admin-only to set, visible in the audit log, and single-use by
          # construction (the next release has a different SHA). See
          # docs/CI-RUNNER.md for when this is legitimate.
          if [ -n "${OVERRIDE_SHA}" ] && [ "${OVERRIDE_SHA}" = "${GITHUB_SHA}" ]; then
            echo "::warning::LIVE GATE OVERRIDDEN for ${GITHUB_SHA} - publishing WITHOUT live camera validation"
            echo "overridden=true" >> "$GITHUB_OUTPUT"
          else
            echo "overridden=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for the live-validation run on this commit
        if: steps.override.outputs.overridden != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Both workflows fire on the same release event, so poll rather than
          # assume ordering. 40 min covers a full fleet run incl. the ~3 min
          # per-camera cooldowns; live-validate.yml itself times out at 45.
          deadline=$(( SECONDS + 40*60 ))
          while [ $SECONDS -lt $deadline ]; do
            runs=$(gh api \
              "repos/${REPO}/actions/workflows/live-validate.yml/runs?head_sha=${SHA}&per_page=20" \
              --jq '[.workflow_runs[] | {status, conclusion}]' 2>/dev/null || echo '[]')

            if echo "$runs" | jq -e 'any(.[]; .status == "completed" and .conclusion == "success")' >/dev/null; then
              echo "live validation succeeded for ${SHA}"
              exit 0
            fi
            if echo "$runs" | jq -e 'any(.[]; .status == "completed" and .conclusion != "success")' >/dev/null; then
              echo "::error::live validation did not succeed for ${SHA}: $(echo "$runs" | jq -c .)"
              exit 1
            fi
            if [ "$(echo "$runs" | jq 'length')" = "0" ]; then
              echo "no live-validate run for ${SHA} yet - waiting (is the self-hosted runner online?)"
            else
              echo "live validation still running - waiting"
            fi
            sleep 30
          done
          echo "::error::timed out waiting for live validation of ${SHA}. Publish blocked."
          echo "::error::If the runner is offline, bring it up and re-run this job, or use the documented override in docs/CI-RUNNER.md."
          exit 1

  publish:
    name: Build and publish
    needs: [test, live-gate]
    runs-on: ubuntu-latest
    # Trusted Publishing: register this repo + workflow (publish.yml) +
    # environment (pypi) under the python-aidot-cameras project on pypi.org.
    # No API token or secret is needed once that is configured.
    environment: pypi
    permissions:
      id-token: write
    # Third-party actions are pinned to full commit SHAs (not moving tags) so a
    # repointed/compromised tag cannot run in this token-minting job. Dependabot
    # (github-actions ecosystem) keeps these current.
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
      # Fail fast if the release tag and the packaged version disagree: a
      # mismatch would publish the wrong version, or hard-fail as a PyPI
      # duplicate. Tags are vX.Y.Z; pyproject carries X.Y.Z.
      - name: Verify tag matches pyproject version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          proj="$(grep -m1 '^version = ' pyproject.toml | sed -E 's/^version = "(.*)"/\1/')"
          echo "release tag: ${tag}   pyproject: ${proj}"
          if [ "${tag}" != "${proj}" ]; then
            echo "::error::release tag (${tag}) does not match pyproject version (${proj})"
            exit 1
          fi
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.13"
      - name: Build sdist and wheel
        run: |
          pip install build twine
          python -m build
      - name: Validate distribution metadata
        run: twine check dist/*
      - name: Publish
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # release/v1 (v1.14.0)
