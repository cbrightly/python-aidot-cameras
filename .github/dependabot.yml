version: 2
updates:
  # Meant to keep the SHA-pinned GitHub Actions in the workflows current. This
  # repository is a fork, and Dependabot version updates do not run on forks
  # unless enabled for the fork, so as configured this file does nothing and
  # the pins are bumped by hand. It is kept so the policy is in one place.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"

  # Python deps are intentionally NOT managed here: pyproject pins conservative
  # lower bounds only (no upper caps) and, under Home Assistant, HA core pins
  # aiohttp/cryptography transitively. A floor is bumped manually after
  # re-validating. Add a "pip" ecosystem block if that policy ever changes.
